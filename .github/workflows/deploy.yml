name: Deploy to Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require the trusted SSH host fingerprint
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          if [[ ! "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            printf '%s\n' 'Set SSH_HOST_FINGERPRINT to the trusted server host key fingerprint.' >&2
            exit 1
          fi
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: 152.70.8.95
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            cd ~/AutoMap-cli
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
