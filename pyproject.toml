[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AutoMap"
version = "0.1.0"
dependencies = [
    "pillow>=12.0.0",
    "click>=8.0.0",
    "google-genai>=1.56.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "flask>=3.1.0",
]

[project.scripts]
automap = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["map"]

[tool.setuptools.package-data]
map = ["filling.json", "filling.template.json"]

