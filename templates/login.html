<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — AutoMap</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b1020; color: #edf2ff; font: 16px system-ui, sans-serif; }
    main { width: 100%; max-width: 390px; padding: 32px; border: 1px solid #303b58; border-radius: 20px; background: #141c30; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #adb8d0; line-height: 1.5; }
    label { display: block; margin: 20px 0 8px; }
    input, button { width: 100%; padding: 13px; border-radius: 9px; font: inherit; }
    input { color: #fff; background: #0b1020; border: 1px solid #465474; }
    input:focus-visible, button:focus-visible { outline: 3px solid #9fb8ff; outline-offset: 3px; }
    button { margin-top: 24px; cursor: pointer; border: 0; background: #8caaff; color: #0b1020; font-weight: 700; }
    .error { color: #ffb4b4; }
    body { min-height: 100svh; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    main { min-width: 0; overflow-wrap: anywhere; }
    input { min-width: 0; }
    button { min-height: 48px; touch-action: manipulation; }
    @media (max-width: 390px) {
      main { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>AutoMap</h1>
    <p>Sign in to access maps and Video Studio.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('web_login') }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="login">Username</label>
      <input id="login" name="login" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
