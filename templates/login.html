<!doctype html>
<!--
Login view rendered by webapp/auth.py, not a generation route.

The server supplies a safe next_url and optional authentication error. The form
posts credentials back to web_login; successful login creates the signed session.
Keep redirect validation on the server and avoid displaying credential values.
Local mode skips this page. Authentication behavior is tested with Flask clients.
-->

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — AutoMap</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
  <main>
    <h1>AutoMap</h1>
    <p>Sign in to access maps and Video Studio.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('web_login') }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="login">Username</label>
      <input id="login" name="login" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
