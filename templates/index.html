<!DOCTYPE html>
<!--
Map generation workspace, served by webapp/pages.py at /.

Feature controllers in static/map/ own form state, provider keys, palettes,
generation, repainting and run history. Markup sections are in templates/map/.
HTTP endpoints are in webapp/generation.py, webapp/analysis.py and webapp/batch.py;
static/studio-storage.js shares persistent assets with Video Studio. Defaults
and payload field names must agree with webapp/inputs.py and the renderer.
Browser tests cover stale responses, storage failure and literal rendering of
untrusted AI labels. Load classic scripts in the explicit order below: shared
state first, feature definitions next, and DOM initialization last.
-->

<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMap Studio — Map generation workspace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Interface type: IBM Plex Sans with JetBrains Mono for parameters -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">

    <script src="{{ url_for('static', filename='map/tailwind.js') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='map/workspace.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='studio.css') }}">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-accent-200 selection:text-slate-100 overflow-x-hidden relative">

    {% include 'map/header.html' %}

    <!-- Main Workspace Layout -->
    <main id="mapWorkspace" class="relative z-10 flex-1 max-w-[1640px] w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <nav aria-label="Workspace sections" class="flex gap-2 lg:hidden col-span-full">
            <a href="#cliForm" class="flex-1 text-center text-xs font-semibold rounded-xl border border-slate-700 bg-slate-900 px-3 py-3 text-accent-300">Parameters</a>
            <a href="#mapStage" class="flex-1 text-center text-xs font-semibold rounded-xl border border-accent-500/40 bg-accent-500/15 px-3 py-3 text-accent-300">Map preview</a>
        </nav>
        {% include 'map/controls.html' %}
        {% include 'map/viewer.html' %}
    </main>

    {% include 'map/filling-studio.html' %}

    {% include 'map/notifications.html' %}

    <!-- Ordered classic scripts share state and inline-handler functions; initialize last. -->
    <script src="{{ url_for('static', filename='studio-storage.js') }}"></script>
    <script src="{{ url_for('static', filename='map/state.js') }}"></script>
    <script src="{{ url_for('static', filename='map/providers.js') }}"></script>
    <script src="{{ url_for('static', filename='map/ideas.js') }}"></script>
    <script src="{{ url_for('static', filename='map/batch.js') }}"></script>
    <script src="{{ url_for('static', filename='map/form.js') }}"></script>
    <script src="{{ url_for('static', filename='map/generation.js') }}"></script>
    <script src="{{ url_for('static', filename='map/viewport.js') }}"></script>
    <script src="{{ url_for('static', filename='map/palette.js') }}"></script>
    <script src="{{ url_for('static', filename='map/analysis.js') }}"></script>
    <script src="{{ url_for('static', filename='map/filling-rules.js') }}"></script>
    <script src="{{ url_for('static', filename='map/history.js') }}"></script>
    <script src="{{ url_for('static', filename='map/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='map/bootstrap.js') }}"></script>

</body>
</html>
