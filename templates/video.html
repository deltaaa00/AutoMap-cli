<!DOCTYPE html>
<!--
Video Studio workspace, served by webapp/pages.py at /studio.

Feature scripts in static/video/ own material selection, previews, render payloads
and progress; templates/video/scripts.html declares their classic-script order.
webapp/media.py proxies requests to media/worker.py; static/studio-storage.js
restores material blobs and static/youtube-upload.js adds upload controls.
Preview pixels and final rendering should share the media/text.py and sticker
contracts. Keep field IDs in sync with both scripts and the browser tests; object
URLs and asynchronous restores must not replace a newer user selection.
-->
