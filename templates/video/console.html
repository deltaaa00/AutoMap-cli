{#
   Worker activity console. Updated by console.js and render.js. Keep IDs and inline
   handlers aligned with static/video scripts.
#}
<!-- Studio Console Output -->
<div class="studio-glass rounded-2xl overflow-hidden">
    <div class="px-4 py-3 bg-slate-950/90 border-b border-slate-800/80 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-slate-800"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-slate-800"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-slate-800"></span>
            </div>
            <span class="text-xs font-semibold text-slate-400 border-b-2 border-slate-700 pb-2 -mb-2.5 flex items-center gap-2 transition">
                <i class="fa-solid fa-terminal"></i>
                <span>Studio Telemetry &amp; Output</span>
            </span>
        </div>
        <button type="button" onclick="clearConsole()" class="text-xs font-mono text-slate-400 hover:text-slate-100 px-2 py-1 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 transition">
            Clear Log
        </button>
    </div>

    <div id="consoleTabContent" class="p-4 bg-slate-950/95 font-mono text-xs h-36 overflow-y-auto space-y-2">
        <div class="text-slate-500">[System] Video Studio initialized and ready.</div>
        <div class="text-slate-400">[Info] Paste a YouTube Music link and click <span class="text-slate-400">Download MP3</span>.</div>
    </div>
</div>
