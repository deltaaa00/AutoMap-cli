services:
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:5000"
    environment:
      PORT: "5000"
      SERVER: "${SERVER:-FALSE}"
      WEB_LOGIN: "${WEB_LOGIN:-deltaaa}"
      WEB_PASSWORD: "${WEB_PASSWORD:-deltaaa00!}"
      WEB_SECRET_KEY: "${WEB_SECRET_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      YOUTUBE_REDIRECT_URI: "${YOUTUBE_REDIRECT_URI:-}"
      YTDLP_URL: http://yt-dlp-worker:8080
      AGENT_URL: "${AGENT_URL:-http://localhost:4000}"
    volumes:
      - automap-session:/app/instance
    networks:
      - app-network

  yt-dlp-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.ytserver
    environment:
      - PORT=8080
      - SERVER=${SERVER:-FALSE}
    volumes:
      - automap-media:/tmp/automap_storage
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  automap-media:
  automap-session:
