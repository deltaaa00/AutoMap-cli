version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:5000"
    environment:
      - PORT=3000
      - RENDER_URL=http://yt-dlp-worker:8080
    networks:
      - app-network

  yt-dlp-worker:
    build:
      context: .
      dockerfile: Dockerfile.ytserver
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - app-network

networks:
  app-network:
    driver: bridge