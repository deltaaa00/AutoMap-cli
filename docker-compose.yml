services:
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${AUTOMAP_BIND_ADDRESS:-127.0.0.1}:3000:5000"
    environment:
      PORT: "5000"
      BIND_HOST: "0.0.0.0"
      SERVER: "${SERVER:-FALSE}"
      WEB_LOGIN: "${WEB_LOGIN:-}"
      WEB_PASSWORD: "${WEB_PASSWORD:-}"
      WEB_TRUSTED_HOSTS: "${WEB_TRUSTED_HOSTS:-}"
      WEB_COOKIE_SECURE: "${WEB_COOKIE_SECURE:-}"
      WEB_SECRET_KEY: "${WEB_SECRET_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
      YOUTUBE_REDIRECT_URI: "${YOUTUBE_REDIRECT_URI:-}"
      YTDLP_URL: http://yt-dlp-worker:8080
      AGENT_URL: "${AGENT_URL:-http://localhost:4000}"
    volumes:
      - automap-session:/app/instance
    networks:
      app-network:
      agent-link:
        aliases:
          - automap-web

  yt-dlp-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.ytserver
    environment:
      - PORT=8080
      - BIND_HOST=0.0.0.0
      - AUTOMAP_STORAGE_DIR=/tmp/automap_storage
      - SERVER=${SERVER:-FALSE}
    volumes:
      - automap-media:/tmp/automap_storage
    networks:
      - app-network

networks:
  agent-link:
    name: automap-agent-link
  app-network:
    driver: bridge

volumes:
  automap-media:
  automap-session:
