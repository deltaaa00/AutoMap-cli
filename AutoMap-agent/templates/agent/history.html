{# Experiment history table shell. static/agent/overview.js renders experiment state, media metrics, and published-video links. #}
<section class="glass rounded-2xl p-5 space-y-3">
    <h2 class="text-sm font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i>
        Experiment History
    </h2>
    <div class="overflow-x-auto">
        <table class="w-full text-xs text-left">
            <thead class="text-slate-400 border-b border-slate-800">
                <tr>
                    <th class="py-2 pr-2">#</th>
                    <th class="py-2 px-2">Topic</th>
                    <th class="py-2 px-2">Effect</th>
                    <th class="py-2 px-2">Status</th>
                    <th class="py-2 px-2">Views (24h/72h)</th>
                    <th class="py-2 px-2">Retention / Watch</th>
                    <th class="py-2 px-2">Engagement</th>
                    <th class="py-2 pl-2 text-right">Score</th>
                </tr>
            </thead>
            <tbody id="historyBody" class="divide-y divide-slate-800/70"></tbody>
        </table>
    </div>
</section>
