{# Own-channel retention and engagement table shell. static/agent/overview.js displays persisted YouTube analytics and sync time. #}
<section class="glass rounded-2xl p-5 space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-chart-line text-sky-400"></i>
            Own Channel Video Analytics (Retention &amp; Engagement)
        </h2>
        <span id="ownAnalyticsSyncedAt" class="text-[11px] font-mono text-slate-400">Not synced yet</span>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-xs text-left">
            <thead class="text-slate-400 border-b border-slate-800">
                <tr>
                    <th class="py-2 pr-3">Video</th>
                    <th class="py-2 px-2">Views</th>
                    <th class="py-2 px-2">Retention &amp; Watch</th>
                    <th class="py-2 px-2">Hook &rarr; End</th>
                    <th class="py-2 px-2">Engagement</th>
                    <th class="py-2 pl-2 text-right">Score</th>
                </tr>
            </thead>
            <tbody id="ownVideosBody" class="divide-y divide-slate-800/70"></tbody>
        </table>
    </div>
</section>
