<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMap Agent — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <form method="POST" class="w-full max-w-sm rounded-2xl bg-slate-900/80 border border-slate-800 p-6 space-y-4 shadow-2xl">
        <div class="text-center space-y-1">
            <h1 class="text-lg font-bold text-white">AutoMap Agent</h1>
            <p class="text-xs text-slate-400">Sign in to manage your autonomous Shorts pipeline</p>
        </div>
        {% if error %}
        <div class="px-3 py-2 rounded-lg bg-rose-950/70 border border-rose-500/40 text-xs text-rose-200">{{ error }}</div>
        {% endif %}
        <label class="block text-xs">
            <span class="text-slate-400">Username</span>
            <input name="username" type="text" required autocomplete="username"
                class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white">
        </label>
        <label class="block text-xs">
            <span class="text-slate-400">Password</span>
            <input name="password" type="password" required autocomplete="current-password"
                class="mt-1 w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white">
        </label>
        <button type="submit" class="w-full py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold transition">
            Sign In
        </button>
    </form>
</body>
</html>
