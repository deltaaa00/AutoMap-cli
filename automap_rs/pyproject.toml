# Build/install this directory with maturin; Cargo.toml defines the native module.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# Python imports automap_rs optionally. The media worker falls back to MoviePy
# when the extension is absent or native rendering fails. FFmpeg is still required
# for either renderer and is supplied by the worker runtime, not this wheel.
[project]
name = "automap_rs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []
